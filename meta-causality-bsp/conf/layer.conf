# BSP layer: kernel config, device names and per-board settings.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-causality-bsp"
BBFILE_PATTERN_meta-causality-bsp = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-causality-bsp = "11"

LAYERDEPENDS_meta-causality-bsp = "core freescale-layer"
LAYERSERIES_COMPAT_meta-causality-bsp = "scarthgap"
