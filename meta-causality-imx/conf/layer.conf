# NXP i.MX BSP layer: kernel config, device names and per-board settings.

BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-causality-imx"
BBFILE_PATTERN_meta-causality-imx = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-causality-imx = "11"

LAYERDEPENDS_meta-causality-imx = "core freescale-layer"
LAYERSERIES_COMPAT_meta-causality-imx = "scarthgap"
